<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>茨城司法書士会調停センター｜書類管理システム</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/pizzip@3.1.3/dist/pizzip.js"></script>
<script src="https://unpkg.com/docxtemplater@3.37.6/build/docxtemplater.js"></script>
<style>
:root{--ink:#1a1714;--paper:#f5f0e8;--paper2:#ede7d9;--accent:#8b4513;--accent2:#c4793a;--pale:#f0e4d4;--muted:#7a7065;--line:#c8bfaa;--green:#2d6a4f;--red:#b03a2e;--amber:#b7791f}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{font-family:'Noto Sans JP',sans-serif;background:var(--paper);color:var(--ink);font-weight:300;min-height:100vh;line-height:1.6}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);padding:1rem}
.login-box{border:1px solid #3a352f;padding:3rem 2.5rem;max-width:420px;width:100%;text-align:center}
.login-title{font-family:'Noto Serif JP',serif;font-size:1.15rem;letter-spacing:.15em;margin-bottom:.4rem}
.login-sub{font:300 .72rem 'DM Mono',monospace;color:#8a8278;letter-spacing:.12em;margin-bottom:2rem}
.btn-login{background:var(--paper);color:var(--ink);border:0;padding:.8rem 1.6rem;font-size:.95rem;border-radius:2px;width:100%}
.btn-login:hover{background:#fff}
.btn-login.alt{background:transparent;color:var(--paper);border:1px solid #6a645b;margin-top:.7rem;font-size:.82rem}
.login-msg{margin-top:1rem;font-size:.8rem;color:#e8a87c;min-height:1.2em;white-space:pre-line;text-align:left}
.login-note{margin-top:1.4rem;font-size:.72rem;color:#8a8278;line-height:1.7;text-align:left}

/* header */
header{background:var(--ink);color:var(--paper);height:54px;padding:0 1.4rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.h-title{font-family:'Noto Serif JP',serif;font-size:.92rem;letter-spacing:.14em}
.h-right{display:flex;align-items:center;gap:.9rem;font:300 .72rem 'DM Mono',monospace;color:#9a9288}
.h-right img{width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:.4rem}
.chip{padding:.15rem .6rem;border-radius:2px;font:300 .66rem 'DM Mono',monospace}
.chip.ok{background:rgba(45,106,79,.35);color:#8fdcb4}
.chip.warn{background:rgba(183,121,31,.35);color:#f0c27a}
.link-btn{background:none;border:0;color:#9a9288;font:inherit;text-decoration:underline}
.link-btn:hover{color:var(--paper)}

/* layout */
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 54px)}
aside{background:var(--ink);color:var(--paper);border-right:1px solid #2c2822;padding:1.2rem 0;display:flex;flex-direction:column}
.a-label{font:300 .62rem 'DM Mono',monospace;letter-spacing:.2em;color:#6f685f;padding:0 1.3rem;margin:.2rem 0 .5rem}
.case{padding:.65rem 1.3rem;cursor:pointer;border-left:3px solid transparent}
.case:hover{background:rgba(255,255,255,.05)}
.case.on{background:rgba(255,255,255,.09);border-left-color:var(--accent2)}
.case .no{font:300 .68rem 'DM Mono',monospace;color:#8f877c}
.case .nm{font-size:.84rem;margin:.1rem 0 .25rem}
.case .st{display:inline-block;font:300 .62rem 'DM Mono',monospace;padding:.08rem .45rem;border-radius:2px;background:#4a453d;color:#e9e2d4}
.case .st.s0{background:#4a6741}.case .st.s1{background:#3d5a80}.case .st.s2{background:#7a5c8a}.case .st.s3{background:#8b4513}.case .st.s4{background:#2d6a4f}.case .st.x{background:#6b3a34}
.case .dirty{color:#f0c27a;font-size:.65rem;margin-left:.4rem}
.a-empty{padding:.6rem 1.3rem;font-size:.78rem;color:#8f877c}
.a-btn{margin:.3rem 1.3rem;padding:.55rem .9rem;background:transparent;border:1px solid #4a453d;color:var(--paper);font-size:.8rem;text-align:left;border-radius:2px;width:calc(100% - 2.6rem)}
.a-btn:hover{border-color:var(--accent2);background:rgba(196,121,58,.1)}
.a-btn.sub{border-color:#2f2b25;color:#a49c90;font-size:.74rem}
.a-sp{flex:1}

/* main */
main{min-width:0;display:flex;flex-direction:column}
.empty{margin:4rem auto;text-align:center;color:var(--muted);max-width:30rem}
.case-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 2rem;border-bottom:1px solid var(--line);background:var(--paper)}
.ch-title{font-family:'Noto Serif JP',serif;font-size:1.05rem;font-weight:400}
.ch-title small{font:300 .72rem 'DM Mono',monospace;color:var(--muted);margin-left:.7rem}
.ch-save{display:flex;align-items:center;gap:.9rem;font:300 .72rem 'DM Mono',monospace;color:var(--muted)}
.ch-save .dirty{color:var(--amber)}
.ch-save .clean{color:var(--green)}
.steps{display:flex;align-items:stretch;background:var(--paper2);border-bottom:1px solid var(--line);padding:.5rem 1.4rem;gap:.2rem;overflow-x:auto}
.step{flex:1;min-width:92px;padding:.45rem .3rem;text-align:center;cursor:pointer;border-radius:2px;border:0;background:none;color:var(--muted)}
.step:hover{background:rgba(0,0,0,.04)}
.step .n{display:inline-flex;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);align-items:center;justify-content:center;font:300 .7rem 'DM Mono',monospace;background:var(--paper)}
.step .l{display:block;font:400 .7rem 'Noto Serif JP',serif;margin-top:.15rem;white-space:nowrap}
.step.done .n{background:var(--green);border-color:var(--green);color:#fff}
.step.on .n{background:var(--accent);border-color:var(--accent);color:#fff}
.step.on .l{color:var(--accent);font-weight:600}
.step.off{opacity:.45;cursor:default}
.step.off:hover{background:none}
.stage{padding:1.6rem 2rem 3rem;max-width:980px}
.h2{font-family:'Noto Serif JP',serif;font-size:1.08rem;font-weight:400;margin-bottom:.4rem;display:flex;align-items:center;gap:.7rem}
.badge{font:300 .62rem 'DM Mono',monospace;background:var(--accent);color:#fff;padding:.15rem .55rem;border-radius:2px}
.lead{color:var(--muted);font-size:.82rem;margin-bottom:1.2rem}
.card{background:#fffdf8;border:1px solid var(--line);border-radius:2px;padding:1.1rem 1.3rem;margin-bottom:1.1rem}
.card>h3{font:400 .86rem 'Noto Serif JP',serif;color:var(--accent);margin-bottom:.8rem;padding-bottom:.45rem;border-bottom:1px solid var(--pale);display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem 1.2rem}
.grid3{grid-template-columns:1fr 1fr 1fr}
.fg{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.fg.full{grid-column:1/-1}
label,.lab{font:300 .7rem 'DM Mono',monospace;color:var(--muted);letter-spacing:.04em}
label em{font-style:normal;color:var(--red);margin-left:.4rem}
small{color:var(--muted);font-size:.72rem}
input[type=text],input[type=date],input[type=tel],input[type=email],input[type=number],select,textarea{width:100%;padding:.5rem .7rem;border:1px solid var(--line);background:#fff;font:300 .9rem 'Noto Sans JP',sans-serif;color:var(--ink);border-radius:2px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:84px}
.chk{display:flex;gap:.6rem;align-items:flex-start;padding:.4rem 0;font:300 .9rem 'Noto Sans JP',sans-serif;color:var(--ink);cursor:pointer}
.chk input{margin-top:.35rem;width:16px;height:16px;accent-color:var(--accent)}
.chk.inline{display:inline-flex;margin-right:1.1rem;padding:.2rem 0}
.radios{display:flex;gap:1.4rem;flex-wrap:wrap}
.note{background:var(--pale);border-left:3px solid var(--accent2);padding:.6rem .9rem;font-size:.8rem;margin:.2rem 0 1rem}
.note.red{background:#f7e3df;border-left-color:var(--red)}
.note.green{background:#e3f0e8;border-left-color:var(--green)}
.warn-txt{color:var(--red);font-size:.78rem}
.docs{display:flex;flex-direction:column;gap:.5rem}
.doc{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:#fff;border:1px solid var(--line);padding:.6rem .9rem;border-radius:2px}
.doc.static{background:transparent;border-style:dashed}
.doc .nm{font-size:.88rem}
.doc .ds{font:300 .7rem 'DM Mono',monospace;color:var(--muted)}
.btn-word{padding:.4rem 1rem;border:1px solid #2980b9;color:#2980b9;background:#fff;font:400 .78rem 'DM Mono',monospace;border-radius:2px;white-space:nowrap}
.btn-word:hover{background:#eef5ff}
.btn{padding:.6rem 1.4rem;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:.85rem;border-radius:2px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.save{border-color:var(--green);color:var(--green)}
.btn.save:hover{background:rgba(45,106,79,.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:.8rem;border-top:1px solid var(--line);padding-top:1rem;margin-top:1.4rem}
.nav .r{display:flex;gap:.7rem}
.sum{width:100%;border-collapse:collapse;font-size:.84rem}
.sum th{width:9rem;text-align:left;font-weight:300;color:var(--muted);padding:.35rem .6rem .35rem 0;vertical-align:top;font-family:'DM Mono',monospace;font-size:.72rem}
.sum td{padding:.35rem 0;border-bottom:1px dotted var(--line);white-space:pre-wrap}
.sum td.blank{color:#b3a999}
.numrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.numrow input{width:5rem;text-align:center}
.pending{opacity:.7}
.later{color:var(--muted);font-size:.82rem;border:1px dashed var(--line);padding:.9rem 1.1rem;margin-top:1.2rem}
dialog{border:1px solid var(--line);background:var(--paper);padding:1.6rem;width:min(480px,92vw);margin:auto}
dialog::backdrop{background:rgba(26,23,20,.65)}
dialog h3{font:400 1rem 'Noto Serif JP',serif;margin-bottom:1rem;padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.dlg-act{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.2rem}
#toast{position:fixed;right:1.4rem;bottom:1.4rem;max-width:380px;background:var(--ink);color:#fff;padding:.75rem 1.1rem;font:300 .8rem 'Noto Sans JP',sans-serif;border-radius:2px;opacity:0;transform:translateY(8px);transition:.25s;z-index:300;pointer-events:none;white-space:pre-line}
#toast.show{opacity:1;transform:none}
#toast.ok{background:var(--green)}#toast.err{background:var(--red)}#toast.warn{background:var(--amber)}
@media(max-width:820px){.layout{grid-template-columns:1fr}aside{max-height:260px;overflow:auto}.grid,.grid3{grid-template-columns:1fr}.stage{padding:1.2rem 1rem 3rem}.case-head{flex-direction:column;align-items:flex-start;padding:.8rem 1rem}}
</style>
</head>
<body>

<!-- ログイン -->
<div id="login">
  <div class="login-box">
    <div class="login-title">茨城司法書士会調停センター</div>
    <div class="login-sub">書類管理システム</div>
    <button class="btn-login" id="btnLogin">Googleでログイン</button>
    <button class="btn-login alt" id="btnLoginLimited" hidden>共有制限モードで続ける</button>
    <div class="login-msg" id="loginMsg"></div>
    <div class="login-note">ログインすると、案件データを保存する Google ドライブへのアクセス許可を求められます。<br>初回は「Google による確認を受けていません」と表示されますが、「詳細」→「（アプリ名）に移動」で進んでください。</div>
  </div>
</div>

<!-- 本体 -->
<div id="app" hidden>
  <header>
    <div class="h-title">茨城司法書士会調停センター｜書類管理システム</div>
    <div class="h-right">
      <span class="chip ok" id="modeChip">Drive接続済み</span>
      <span id="userBox"></span>
      <button class="link-btn" id="btnSettings">設定</button>
    </div>
  </header>
  <div class="layout">
    <aside>
      <div class="a-label">案件一覧</div>
      <div id="caseList"></div>
      <div class="a-label" style="margin-top:1.2rem">操作</div>
      <button class="a-btn" id="btnNew">＋ 新規案件</button>
      <button class="a-btn sub" id="btnReload">↻ 最新を読み込む</button>
      <a class="a-btn sub" id="lnkFolder" target="_blank" rel="noopener" style="text-decoration:none;display:block">📁 Driveのフォルダを開く</a>
      <div class="a-sp"></div>
    </aside>
    <main>
      <div id="empty" class="empty" hidden></div>
      <div id="caseArea" hidden>
        <div class="case-head">
          <div class="ch-title" id="chTitle"></div>
          <div class="ch-save"><span id="saveState"></span><button class="btn save" id="btnSave">保存</button></div>
        </div>
        <div class="steps" id="steps"></div>
        <div class="stage" id="stage"></div>
      </div>
    </main>
  </div>
</div>

<!-- 新規案件 -->
<dialog id="dlgNew">
  <h3>新規案件</h3>
  <div class="fg"><label>申込人（これから申立人になる方）の氏名</label><input type="text" id="newName" placeholder="山田 太郎"></div>
  <div class="dlg-act"><button class="btn" id="newCancel">キャンセル</button><button class="btn primary" id="newOk">作成</button></div>
</dialog>

<!-- 設定 -->
<dialog id="dlgSet">
  <h3>設定（全員共通・Driveに保存）</h3>
  <div class="grid">
    <div class="fg"><label>センター長</label><input type="text" id="setCho" placeholder="姓　名"></div>
    <div class="fg"><label>事務長</label><input type="text" id="setJim" placeholder="姓　名"></div>
    <div class="fg full"><label>事務担当者の候補（1行に1人）</label><textarea id="setMem" rows="5" placeholder="入力時の候補として表示されます"></textarea></div>
  </div>
  <small>ご案内のセンター長名、受理決定書の事務長名に使われます。交代したときはここを直すだけです。</small>
  <div class="dlg-act"><button class="btn" id="setCancel">閉じる</button><button class="btn primary" id="setOk">保存</button></div>
</dialog>

<datalist id="dlMembers"></datalist>
<div id="toast"></div>

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const fwd = s => String(s ?? '').replace(/[0-9]/g, d => String.fromCharCode(d.charCodeAt(0) + 0xFEE0));
const getP = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o) ?? '';
const setP = (o, p, v) => { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach(k => a = (a[k] ??= {})); a[ks.at(-1)] = v; };
function parseIso(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }
function todayIso() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function addDays(iso, n) { const p = parseIso(iso); if (!p) return ''; return new Date(Date.UTC(p.y, p.m - 1, p.d + n)).toISOString().slice(0, 10); }
function eraOf(p) { const n = p.y * 10000 + p.m * 100 + p.d;
  if (n >= 20190501) return ['令和', p.y - 2018]; if (n >= 19890108) return ['平成', p.y - 1988];
  if (n >= 19261225) return ['昭和', p.y - 1925]; if (n >= 19120730) return ['大正', p.y - 1911]; return ['明治', p.y - 1867]; }
function wareki(iso) { const p = parseIso(iso); if (!p) return ''; const [g, n] = eraOf(p); return `${g}${n === 1 ? '元' : fwd(n)}年${fwd(p.m)}月${fwd(p.d)}日`; }
function reiwaYear(iso) { const p = parseIso(iso); return p ? p.y - 2018 : ''; }
function ageOn(birth, ref) { const b = parseIso(birth), r = parseIso(ref); if (!b || !r) return ''; let a = r.y - b.y; if (r.m < b.m || (r.m === b.m && r.d < b.d)) a--; return a >= 0 ? a : ''; }
function zip7(z) { const d = String(z || '').replace(/[^0-9０-９]/g, '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); return d.length === 7 ? d.slice(0, 3) + '-' + d.slice(3) : String(z || '').trim(); }
function addrWithZip(z, a) { const zz = zip7(z); return (zz ? '〒' + zz + ' ' : '') + (a || ''); }
function yen(k) { const d = String(k ?? '').replace(/[^0-9]/g, ''); return d ? Number(d).toLocaleString('en-US') : ''; }
const box = b => b ? '■' : '□';
const caseNo = c => c.juri_no ? `令和${fwd(c.juri_year)}年第${fwd(c.juri_no)}号` : '';
const fmtTime = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { } }

function nextNo(year, exceptUid) { let m = 0; S.cases.forEach(x => { if (x.uid !== exceptUid && String(x.juri_year) === String(year) && x.juri_no) m = Math.max(m, parseInt(x.juri_no, 10) || 0); }); return m + 1; }
function dupOf(c) { if (!c.juri_no) return null; return S.cases.find(x => x.uid !== c.uid && String(x.juri_year) === String(c.juri_year) && String(x.juri_no) === String(c.juri_no)) || null; }
function nameOf(c) { return c.a_name || c.mk_name || '（氏名未入力）'; }

/* 各段階に初めて入ったとき、入力の手間を減らすための初期値 */
function prep(c, n) {
  const t = todayIso();
  if (n === 1) { c.md_bi ||= t; c.uk_bi ||= t; c.a_name ||= c.mk_name || ''; c.a_tel ||= c.mk_tel || ''; }

  if (n === 4) { c.irai_bi ||= t; c.annai_bi ||= c.irai_bi; c.kaito_kigen ||= addDays(c.annai_bi, 10); c.annai_gaiyo ||= c.jian_gaiyo; }
}

/* ============ Google 認証・Drive ============ */
function getToken(scope, prompt) {
  return new Promise((res, rej) => {
    if (!window.google?.accounts?.oauth2) return rej({ error: 'gsi_not_loaded' });
    const cl = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope, callback: r => r.error ? rej(r) : res(r), error_callback: e => rej(e) });
    cl.requestAccessToken({ prompt });
  });
}
function setToken(r) { S.token = r.access_token; S.tokenExp = Date.now() + (Number(r.expires_in) || 3600) * 1000; }
async function ensureToken() { if (S.token && Date.now() < S.tokenExp - 60000) return;
  try { setToken(await getToken(S.scope, '')); }
  catch (e) { const x = new Error('ログインの有効期限が切れました。もう一度「保存」を押すか、ページを再読み込みして再ログインしてください（' + (e.type || e.error || '') + '）'); x.status = 401; throw x; } }
async function gfetch(url, opts = {}, retried = false) {
  await ensureToken();
  const res = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + S.token } });
  if (res.status === 401 && !retried) { S.tokenExp = 0; return gfetch(url, opts, true); }
  if (!res.ok) { const e = new Error('Drive ' + res.status); e.status = res.status; e.body = await res.text().catch(() => ''); throw e; }
  return res;
}
async function listAll(q, fields) {
  let out = [], tok = '';
  do {
    const u = `${API}/files?q=${encodeURIComponent(q)}&fields=${encodeURIComponent('nextPageToken,files(' + fields + ')')}&pageSize=1000&orderBy=createdTime` + (tok ? '&pageToken=' + encodeURIComponent(tok) : '');
    const j = await (await gfetch(u)).json(); out = out.concat(j.files || []); tok = j.nextPageToken || '';
  } while (tok);
  return out;
}
async function ensureFolder() {
  const found = await listAll(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`, 'id,name');
  if (found.length) { S.folderId = found[0].id; return; }
  const r = await (await gfetch(`${API}/files?fields=id`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }) })).json();
  S.folderId = r.id;
}
async function putJson(name, obj, fileId) {
  const meta = fileId ? { name } : { name, parents: [S.folderId], mimeType: 'application/json' };
  const fd = new FormData();
  fd.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
  fd.append('file', new Blob([JSON.stringify(obj, (k, v) => k.startsWith('_') ? undefined : v, 1)], { type: 'application/json' }));
  const url = `${UP}/files${fileId ? '/' + fileId : ''}?uploadType=multipart&fields=id,modifiedTime`;
  return (await gfetch(url, { method: fileId ? 'PATCH' : 'POST', body: fd })).json();
}
async function mapLimit(items, n, fn) { const out = new Array(items.length); let i = 0; await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k]); } })); return out; }

async function loadAll() {
  const files = await listAll(`'${S.folderId}' in parents and trashed=false`, 'id,name,modifiedTime,lastModifyingUser(displayName)');
  const st = files.find(f => f.name === SETTINGS_FILE);
  if (st) { try { const j = await (await gfetch(`${API}/files/${st.id}?alt=media`)).json(); S.settings = { cho: j.cho || '', jimucho: j.jimucho || '', members: j.members || [] }; S.settingsFileId = st.id; } catch (e) { console.warn(e); } }
  const cf = files.filter(f => f.name.startsWith('案件_') && f.name.endsWith('.json'));
  let bad = 0;
  const got = await mapLimit(cf, 6, async f => {
    try { const j = await (await gfetch(`${API}/files/${f.id}?alt=media`)).json(); if (j.schema !== 2 || !j.uid) return null;
      j._fileId = f.id; j._modified = f.modifiedTime; j._modifiedBy = f.lastModifyingUser?.displayName || ''; return j; }
    catch (e) { console.warn('読込失敗', f.name, e); bad++; return null; }
  });
  const map = new Map();
  got.filter(Boolean).forEach(j => { const o = map.get(j.uid); if (!o || o._modified < j._modified) map.set(j.uid, j); });
  S.cases = [...map.values()].sort((a, b) => (b.created || '').localeCompare(a.created || ''));
  if (bad) toast(`${bad}件の案件ファイルを読み込めませんでした。\nもう一度「最新を読み込む」を試してください。`, 'warn', 6000);
  applySettingsUI();
}
function fileNameOf(c) { const tag = c.juri_no ? `R${c.juri_year}-${c.juri_no}` : '受理前'; return `案件_${tag}_${nameOf(c)}.json`.replace(/[\\/:*?"<>|]/g, ''); }

/* 保存。戻り値 true=成功 */
async function saveCase(c, force = false) {
  if (c._fileId && !force) {
    const m = await (await gfetch(`${API}/files/${c._fileId}?fields=modifiedTime,lastModifyingUser(displayName)`)).json();
    if (m.modifiedTime !== c._modified) {
      const who = m.lastModifyingUser?.displayName || '他の方';
      if (!confirm(`${who}さんが、この案件を ${fmtTime(m.modifiedTime)} に更新しています。\n\nこのまま保存すると、その変更が上書きされて消えます。\n上書きして保存しますか？\n（キャンセル → 保存せず、あとで「最新を読み込む」で確認できます）`)) return false;
    }
  }
  c.updated = new Date().toISOString(); c.updatedBy = S.user?.name || '';
  const r = await putJson(fileNameOf(c), c, c._fileId);
  c._fileId = r.id; c._modified = r.modifiedTime; c._modifiedBy = S.user?.name || '';
  return true;
}
let saving = null;
async function persist(opts = {}) {
  const c = cur(); if (!c) return true;
  if (saving) await saving;
  if (!S.dirty && !opts.force && c._fileId) return true;
  setSaveState('saving');
  saving = (async () => {
    try { const ok = await saveCase(c); if (ok) { S.dirty = false; setSaveState(); if (!opts.quiet) toast('保存しました', 'ok', 1800); } else setSaveState(); return ok; }
    catch (e) { console.error(e); setSaveState(); toast('保存できませんでした。\nネットワークやログイン状態を確認して、もう一度「保存」を押してください。\n（' + (e.message || e.error || e.type || JSON.stringify(e)) + '）', 'err', 7000); return false; }
    finally { saving = null; }
  })();
  return saving;
}

/* ============ ログイン ============ */
async function login(limited) {
  const msg = $('#loginMsg'); msg.textContent = ''; $('#btnLoginLimited').hidden = true;
  const btns = [$('#btnLogin'), $('#btnLoginLimited')]; btns.forEach(b => b.disabled = true);
  try {
    S.scope = limited ? SCOPE_LIMITED : SCOPE_FULL; S.limited = !!limited;
    const r = await getToken(S.scope, '');
    if (!limited && !google.accounts.oauth2.hasGrantedAllScopes(r, SCOPE_DRIVE)) throw { error: 'scope_not_granted' };
    setToken(r);
    const ui = await (await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + S.token } })).json();
    S.user = { name: ui.name || ui.email || '', email: ui.email || '', picture: ui.picture || '' };
    msg.textContent = '案件データを読み込んでいます…';
    await ensureFolder(); await loadAll();
    startApp();
  } catch (e) {
    console.error(e);
    if (e.type === 'popup_closed' || e.type === 'popup_failed_to_open') msg.textContent = 'ログインの画面が閉じられました。もう一度押してください。\n（ポップアップがブロックされていないかも確認してください）';
    else if (e.error === 'access_denied') msg.textContent = '許可されませんでした。\nテストユーザーとして登録されているアカウントか確認してください。';
    else if (e.error === 'scope_not_granted') msg.textContent = 'Googleドライブへのアクセスにチェックを入れて許可してください。\n（チェックがないと案件を保存できません）';
    else if (e.error === 'invalid_scope' || e.error === 'invalid_request') { msg.textContent = 'ドライブ全体へのアクセス設定が未完了です。\n共有制限モードでは、自分が作成した案件しか見えません。'; $('#btnLoginLimited').hidden = false; }
    else if (e.error === 'gsi_not_loaded') msg.textContent = 'Googleのログイン部品を読み込めませんでした。ページを再読み込みしてください。';
    else msg.textContent = 'ログインできませんでした。\n' + (e.message || e.error || '') + (e.status === 403 ? '\n（Drive APIが有効か、権限が許可されているか確認してください）' : '');
  } finally { btns.forEach(b => b.disabled = false); }
}

/* --- ⑤ 送付依頼 --- */
function stage4(c) {
  if (c.kt !== '受理') return `<div class="h2">送付の依頼 <span class="badge">STAGE 5</span></div><div class="note red">「③ 受理決定」で「受理」を選んでから進んでください。</div>${nav(3, '', 0)}`;
  return `<div class="h2">送付の依頼（事務局へ） <span class="badge">STAGE 5</span></div>
  <p class="lead">発送は茨城司法書士会の事務局が行います。いずれも<b>配達証明付き</b>。必要な書類と依頼票をここで作ります。　手続実施規程第18条</p>
  <div class="note green">相手方への送付期限の目安：<b>${esc(wareki(hassoKigen(c)))}</b>（受理決定日から5日）</div>
  <div class="card"><h3>ご案内に入れる項目</h3><div class="grid">
    ${field('ご案内の発信日', 'annai_bi', { type: 'date' })}${field('回答期限', 'kaito_kigen', { type: 'date', hint: '発信日から10日後を入れています。必要なら直してください' })}
    ${field('事務担当者', 'tantou', { list: 'dlMembers' })}<div></div>
    ${field('ご案内に載せる申立ての内容', 'annai_gaiyo', { type: 'textarea', rows: 3, full: true, hint: '相手方に読まれます。住所・地番など、特定に必要な内容を足してください' })}</div></div>
  <div class="card"><h3>発送先</h3><div class="lab" style="margin-bottom:.4rem">申立人</div><div class="grid">${field('郵便番号', 'a_zip', { im: 'numeric' })}${field('住所', 'a_addr')}</div>
    <div class="lab" style="margin:1rem 0 .4rem">相手方</div><div class="grid">${field('郵便番号', 'b_zip', { im: 'numeric' })}${field('住所', 'b_addr')}</div></div>
  <div class="card"><h3>書類</h3><div class="docs">
    <div class="lab">申立人あて</div>
    ${docRow('juri', '受理決定書', '④で作成したもの')}${staticRow('申立書の写し', '署名押印済みの申立書をコピー')}
    <div class="lab" style="margin-top:.6rem">相手方あて</div>
    ${docRow('annai', '調停センターからのご案内', '上の項目が入ります')}${docRow('kaito', '回答書（兼答弁書）', '事案番号が入ります')}
    ${staticRow('調停センター利用申込にあたって（ADR法第14条の説明書）', '既存の書類を同封')}${staticRow('手続実施者一覧', '既存の書類を同封')}
    <div class="lab" style="margin-top:.6rem">事務局あて</div>
    ${docRow('hasso', '発送依頼票', '発送先・同封物・期限をまとめた依頼票')}</div></div>
  <div class="card"><h3>事務局への依頼</h3><div class="grid">
    ${field('依頼日', 'irai_bi', { type: 'date' })}${field('依頼票の備考（任意）', 'bikou')}</div>
    <div style="margin:.8rem 0"><button class="btn" data-act="copyMail">依頼文（メール用）をコピー</button></div>
    <div class="grid">${chk('事務局に依頼した', 'irai_done')}${field('発送完了日（事務局から連絡があったら）', 'hasso_bi', { type: 'date' })}</div></div>
  <div class="later">応諾の確認・手続実施者の選任・期日調整・期日・合意書・終了 の画面は、これから順に作ります。</div>
  ${nav(3, '', 0)}`;
}
const STAGES = [stage0, stage1, stage2, stage3, stage4];
function renderStage() {
  const c = cur(); if (S.view > 4) S.view = 4; prep(c, S.view);
  $('#stage').innerHTML = STAGES[S.view](c); updateDerived();
  window.scrollTo({ top: 0 });
}
function updateDerived() {
  const c = cur(), a = $('#ageOut'); if (a) { const g = ageOn(c.a_birth, c.uk_bi || todayIso()); a.textContent = g !== '' ? `満${g}歳（申立書の日付時点）` : ''; }
}

/* ============ 書類の出力 ============ */
const DOCS = {
  moshitate: { tpl: '申立書', name: c => `調停申立書_${nameOf(c)}`, need: c => [['申立書の提出日', c.uk_bi], ['申立人の氏名', c.a_name], ['相手方の氏名', c.b_name]],
    data: c => ({ 申立日: wareki(c.uk_bi), 申立人住所: addrWithZip(c.a_zip, c.a_addr), 申立人氏名: c.a_name, 申立人生年月日: c.a_birth ? wareki(c.a_birth) : '　　年　　月　　日', 申立人年齢: c.a_birth ? fwd(ageOn(c.a_birth, c.uk_bi || todayIso())) : '　　　', 申立人職業: c.a_job, 申立人電話: c.a_tel, 申立人携帯: c.a_mobile, 申立人メール: c.a_email,
      代理人住所: c.d_has ? addrWithZip(c.d_zip, c.d_addr) : '', 代理人氏名: c.d_has ? c.d_name : '', 代理人電話: c.d_has ? c.d_tel : '', 代理人携帯: c.d_has ? c.d_mobile : '', 代理人メール: c.d_has ? c.d_email : '',
      相手方住所: addrWithZip(c.b_zip, c.b_addr), 相手方氏名: c.b_name, 相手方職業: c.b_job, 相手方電話: c.b_tel, 相手方携帯: c.b_mobile, 相手方メール: c.b_email,
      紛争概要: c.gaiyo, 紛争金額: yen(c.kingaku) || '　　　　　　　', 申立の趣旨: c.shushi,
      曜日_平日: box(c.kb_yobi?.heijitsu), 曜日_土日祝: box(c.kb_yobi?.doniti), 曜日_その他: box(c.kb_yobi?.sonota), 曜日補足: c.kb_yobi_memo,
      時間_午前: box(c.kb_jikan?.gozen), 時間_午後: box(c.kb_jikan?.gogo), 時間_午前午後: box(c.kb_jikan?.gozengogo), 時間補足: c.kb_jikan_memo,
      場所_水戸: box(c.kb_basho?.mito), 場所_つくば: box(c.kb_basho?.tsukuba) }) },
  juri: { tpl: '受理決定書', name: c => `受理決定書_${caseNo(c) || nameOf(c)}`, need: c => [['宛名', c.atena], ['事案名', c.jian_mei], ['申立人の氏名', c.a_name], ['相手方の氏名', c.b_name], ['受付年月日', c.uk_bi], ['受理決定日', c.kt_bi], ['受理事案番号', c.juri_no], ['事務長（設定）', S.settings.jimucho]],
    data: c => ({ 発行日: wareki(c.hk_bi || c.kt_bi), 宛名: c.atena || c.a_name, 事務長: S.settings.jimucho, 事案名: c.jian_mei, 申立人氏名: c.a_name, 相手方氏名: c.b_name, 事案概要: c.jian_gaiyo, 受付日: wareki(c.uk_bi), 受理決定日: wareki(c.kt_bi), 受理年: fwd(c.juri_year), 受理連番: fwd(c.juri_no) }) },
  annai: { tpl: 'ご案内', name: c => `ご案内_${caseNo(c) || nameOf(c)}`, need: c => [['相手方の氏名', c.b_name], ['申立人の氏名', c.a_name], ['ご案内の発信日', c.annai_bi], ['回答期限', c.kaito_kigen], ['申立ての内容', c.annai_gaiyo], ['事務担当者', c.tantou], ['センター長（設定）', S.settings.cho]],
    data: c => ({ 発信日: wareki(c.annai_bi), 相手方氏名: c.b_name, センター長: S.settings.cho, 申立人氏名: c.a_name, 申立概要: c.annai_gaiyo, 回答期限: wareki(c.kaito_kigen), 事務担当者: c.tantou }) },
  kaito: { tpl: '回答書', name: c => `回答書_${caseNo(c) || nameOf(c)}`, need: c => [['受理事案番号', c.juri_no]],
    data: c => ({ 受理年: fwd(c.juri_year), 受理連番: fwd(c.juri_no) }) },
  hasso: { tpl: '発送依頼票', name: c => `発送依頼票_${caseNo(c) || nameOf(c)}`, need: c => [['依頼日', c.irai_bi], ['事務担当者', c.tantou], ['申立人の住所', c.a_addr], ['相手方の住所', c.b_addr], ['回答期限', c.kaito_kigen]],
    data: c => ({ 依頼日: wareki(c.irai_bi), 事務担当者: c.tantou, 受理年: fwd(c.juri_year), 受理連番: fwd(c.juri_no), 発送期限: wareki(hassoKigen(c)),
      申立人郵便番号: zip7(c.a_zip), 申立人住所: c.a_addr, 申立人宛名: c.a_name, 相手方郵便番号: zip7(c.b_zip), 相手方住所: c.b_addr, 相手方宛名: c.b_name, 回答期限: wareki(c.kaito_kigen), 備考: c.bikou }) },
};
function renderDocx(tplName, data) {
  const zip = new PizZip(TEMPLATES[tplName], { base64: true });
  const doc = new docxtemplater(zip, { paragraphLoop: true, linebreaks: true, delimiters: { start: '{{', end: '}}' }, nullGetter: () => '' });
  doc.render(data);
  return doc.getZip().generate({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression: 'DEFLATE' });
}
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name.replace(/[\\/:*?"<>|]/g, '') + '.docx'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
async function genDoc(key) {
  const c = cur(), d = DOCS[key]; if (!c || !d) return;
  const miss = d.need(c).filter(([, v]) => v === '' || v == null).map(([l]) => l);
  try { download(renderDocx(d.tpl, d.data(c)), d.name(c)); }
  catch (e) { console.error(e, e.properties?.errors); toast('書類を作れませんでした。\n（' + (e.message || e.error || e.type || JSON.stringify(e)) + '）', 'err', 7000); return; }
  toast(miss.length ? `出力しました。\n空欄のままの項目：${miss.join('、')}` : '出力しました', miss.length ? 'warn' : 'ok', miss.length ? 6000 : 2200);
  await persist({ quiet: true, force: true });
}
function mailText(c) {
  return `茨城司法書士会事務局　御中\n\n調停センター事務担当者の${c.tantou || '（担当者名）'}です。\n下記の郵便物の発送をお願いします。いずれも配達証明付きです。\n\n■事案番号：${caseNo(c)}\n■発送期限：${wareki(hassoKigen(c))}まで\n\n【申立人あて】\n〒${zip7(c.a_zip)}\n${c.a_addr || ''}\n${c.a_name || ''} 様\n・受理決定書\n・調停申立書の写し\n\n【相手方あて】\n〒${zip7(c.b_zip)}\n${c.b_addr || ''}\n${c.b_name || ''} 様\n・調停センターからのご案内\n・調停センター利用申込にあたって（ADR法第14条に基づく説明書）\n・手続実施者一覧\n・回答書\n\n${c.bikou ? c.bikou + '\n\n' : ''}発送後、発送日をご連絡ください。よろしくお願いします。`;
}
async function copyMail() {
  const t = mailText(cur());
  try { await navigator.clipboard.writeText(t); toast('依頼文をコピーしました。メールに貼り付けてください', 'ok'); }
  catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); toast(ok ? '依頼文をコピーしました。メールに貼り付けてください' : 'コピーできませんでした', ok ? 'ok' : 'err'); }
}

/* ============ 操作 ============ */
async function selectCase(uid) {
  if (uid === S.cur) return;
  if (S.dirty && !(await persist({ quiet: true }))) { if (!confirm('保存できていない変更があります。このまま移動すると変更が失われます。移動しますか？')) return; S.dirty = false; }
  S.cur = uid; const c = cur(); S.view = Math.min(c.stage || 0, 4); renderAll();
}
async function goView(n) { const ok = !S.dirty || await persist({ quiet: true }); if (!ok && !confirm('保存できていません。このまま移動しますか？')) return; S.view = n; renderSteps(); renderStage(); }
async function goNext(n) { const c = cur(); c.stage = Math.max(c.stage, n); S.dirty = true; await persist({ quiet: true }); S.view = n; renderAll(); }

function onField(e) {
  const el = e.target, f = el.dataset.f; if (!f) return; const c = cur();
  if (el.type === 'radio' && !el.checked) return;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  setP(c, f, v); markDirty();
  if (f === 'tantou' && v) lsSet('tantou', v);
  if (f === 'a_birth' || f === 'uk_bi') updateDerived();
  if (f === 'd_has') $('#dairiBlock').hidden = !v;
  if (f === 'mk_name' || f === 'a_name' || f === 'b_name') $('#chTitle').innerHTML = `${esc(nameOf(c))} さん${c.b_name ? ' ／ 相手方 ' + esc(c.b_name) : ''}<small>${esc(caseNo(c) || '受理前')}</small>`;
  if (f === 'kt') { if (v === '受理') { c.juri_year ||= reiwaYear(c.kt_bi || todayIso()); c.juri_no ||= nextNo(c.juri_year, c.uid); } renderStage(); renderList(); }
  if (f === 'kt_bi') { const k = $('#kigenDate'); if (k) k.textContent = wareki(hassoKigen(c)); }
  if (f === 'juri_year' || f === 'juri_no') { const d = dupOf(c), m = $('#dupMsg'); if (m) m.textContent = d ? `この番号は「${nameOf(d)}」さんの案件ですでに使われています。` : ''; $('#chTitle small').textContent = caseNo(c) || '受理前'; renderList(); }
}

function openDlg(d) { d.showModal(); }
document.addEventListener('click', e => {
  const t = e.target;
  let n;
  if ((n = t.closest('[data-uid]'))) selectCase(n.dataset.uid);
  else if ((n = t.closest('[data-step]'))) goView(+n.dataset.step);
  else if ((n = t.closest('[data-doc]'))) genDoc(n.dataset.doc);
  else if ((n = t.closest('[data-go]'))) goView(+n.dataset.go);
  else if ((n = t.closest('[data-next]'))) goNext(+n.dataset.next);
  else if ((n = t.closest('[data-act]'))) { const a = n.dataset.act; if (a === 'save') persist({ force: true }); if (a === 'copyMail') copyMail(); }
});
$('#stage').addEventListener('input', onField); $('#stage').addEventListener('change', onField);
$('#btnSave').addEventListener('click', () => persist({ force: true }));
$('#btnLogin').addEventListener('click', () => login(false));
$('#btnLoginLimited').addEventListener('click', () => login(true));
$('#btnNew').addEventListener('click', () => { $('#newName').value = ''; openDlg($('#dlgNew')); $('#newName').focus(); });
$('#newCancel').addEventListener('click', () => $('#dlgNew').close());
$('#newOk').addEventListener('click', async () => {
  const name = $('#newName').value.trim(); if (!name) { toast('氏名を入力してください', 'warn'); return; }
  if (S.dirty && !(await persist({ quiet: true }))) return;
  const c = newCase(name); S.cases.unshift(c); S.cur = c.uid; S.view = 0; S.dirty = true; $('#dlgNew').close(); renderAll(); await persist({ quiet: true, force: true }); toast('案件を作成しました', 'ok');
});
$('#newName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#newOk').click(); });
$('#btnReload').addEventListener('click', async () => {
  if (S.dirty && !confirm('保存していない変更は消えます。最新を読み込みますか？')) return;
  try { toast('読み込み中…'); S.dirty = false; await loadAll(); if (!cur()) S.cur = S.cases[0]?.uid || null; renderAll(); toast('最新の状態を読み込みました', 'ok'); }
  catch (e) { console.error(e); toast('読み込めませんでした（' + (e.message || e.error || e.type || JSON.stringify(e)) + '）', 'err'); }
});
$('#btnSettings').addEventListener('click', () => { $('#setCho').value = S.settings.cho; $('#setJim').value = S.settings.jimucho; $('#setMem').value = (S.settings.members || []).join('\n'); openDlg($('#dlgSet')); });
$('#setCancel').addEventListener('click', () => $('#dlgSet').close());
$('#setOk').addEventListener('click', async () => {
  S.settings = { cho: $('#setCho').value.trim(), jimucho: $('#setJim').value.trim(), members: $('#setMem').value.split('\n').map(s => s.trim()).filter(Boolean) };
  try { const r = await putJson(SETTINGS_FILE, S.settings, S.settingsFileId); S.settingsFileId = r.id; applySettingsUI(); $('#dlgSet').close(); toast('設定を保存しました', 'ok'); if (cur()) renderStage(); }
  catch (e) { console.error(e); toast('設定を保存できませんでした（' + (e.message || e.error || e.type || JSON.stringify(e)) + '）', 'err'); }
});
</script>
</body>
